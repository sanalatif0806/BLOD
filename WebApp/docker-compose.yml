services:
  backend:
    build: ./backend
    container_name: BLOD-backend
    restart: unless-stopped
    ports:
      - "5005:5005"
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URI=mongodb://admin:password@mongodb:27017/healthcloud?authSource=admin
      - DB_NAME=healthcloud
      - PORT=5005
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build: ./frontend/blod
    container_name: BLOD-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network
    environment:
      - REACT_APP_API_URL=http://localhost:5005
      - REACT_APP_DASHBOARD_BACKEND=http://localhost:5001

  mongodb:
    image: mongo:6.0
    container_name: BLOD-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=healthcloud
    volumes:
      - mongo_data:/data/db
      - ./backend/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh
      - ./backend/BLOD.json:/docker-entrypoint-initdb.d/BLOD.json
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  python-service:
    build: ../python_service/
    container_name: BLOD-python-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - ../python_service/.env
    environment:
      - BACKEND_URL=http://backend:5005
    volumes:
      - python_service_data:/data
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  mongo_data:
  python_service_data:

networks:
  app-network:
    driver: bridge
